spring.application.name=retail-backend

server.port=8080

spring.datasource.url=jdbc:h2:mem:retaildb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- RetailIQ ----
retail.timezone=Asia/Kolkata
retail.cors.allowed-origins=http://localhost:4200,http://localhost:8080
retail.seed.enabled=true
retail.insights.recent-days=14
retail.delivery.fee=99
retail.delivery.free-above=2499

# Optional: set to let an LLM phrase assistant answers (facts still come from app data).
retail.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
retail.ai.anthropic.model=claude-sonnet-5-5
retail.ai.anthropic.timeout-seconds=15
